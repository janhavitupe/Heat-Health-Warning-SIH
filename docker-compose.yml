# Run the whole app on one machine:
#   cp .env.deploy.example .env      (then edit .env: at least HEAT_API_TOKEN)
#   docker compose up -d --build     ->  http://<server>:8000/?replay=may2024
# First start takes 1-2 minutes (builds the May 2024 replay); watch with: docker compose logs -f
# With a domain and HTTPS, add the Caddy file:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  heat:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HEAT_SCHEDULER: "1"
      TZ: Asia/Kolkata
      HEAT_DEMO: ${HEAT_DEMO:-1}
    volumes:
      - heat-db:/app/data/api
    restart: unless-stopped
volumes:
  heat-db:
