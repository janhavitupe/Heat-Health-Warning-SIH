[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatrisk"
version = "0.1.0"
description = "Hyper-local heat-health early warning and decision support (SIH 2026, PS 26083)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "geopandas>=0.14",
    "shapely>=2",
    "requests>=2.31",
    "thermofeel>=2.3",
    "pythermalcomfort>=3.0",
    "networkx>=3.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gee = ["earthengine-api>=0.1.390"]
pdf = ["pdfplumber>=0.11"]            # scripts/extract_slums.py
access = ["osmnx>=2.0"]                # scripts/build_walk_network.py, build_access.py
api = ["fastapi>=0.110", "uvicorn>=0.29", "apscheduler>=3.10,<4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["heatrisk*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
