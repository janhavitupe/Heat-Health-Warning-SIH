[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatrisk"
version = "0.1.0"
description = "Hyper-local heat-health early warning and decision support (SIH 2026, PS 26083)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "geopandas>=0.14",
    "shapely>=2",
    "requests>=2.31",
    "thermofeel>=2.3",
    "pythermalcomfort>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gee = ["earthengine-api>=0.1.390"]

[tool.setuptools.packages.find]
include = ["heatrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
